# NeuralBeatX GPU worker · ACE-Step 1.5
# Requires NVIDIA Container Toolkit, Docker Compose v2 and an authorized GPU server.
# Uses the official ACE-Step repository's maintained CUDA Dockerfile.
# GPU, HTTPS endpoint and server billing are NOT provisioned by this file.
services:
  acestep:
    build:
      context: https://github.com/ace-step/ACE-Step-1.5.git#main
    image: neuralbeatx/acestep-v1.5:local
    restart: unless-stopped
    gpus: all
    environment:
      ACESTEP_MODE: api
      ACESTEP_API_HOST: 0.0.0.0
      ACESTEP_API_PORT: "8001"
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:?Set ACESTEP_API_KEY in .env}
      ACESTEP_CONFIG_PATH: acestep-v15-turbo
      ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-0.6B
      ACESTEP_LLM_BACKEND: pt
      ACESTEP_QUEUE_WORKERS: "1"
      ACESTEP_QUEUE_MAXSIZE: "12"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - checkpoints:/app/checkpoints
      - output:/app/output
    expose:
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 45s
      timeout: 12s
      retries: 8
      start_period: 600s
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - acestep
    ports:
      - "80:80"
      - "443:443"
    environment:
      NBX_GPU_DOMAIN: ${NBX_GPU_DOMAIN:?Set NBX_GPU_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  checkpoints:
  output:
  caddy_data:
  caddy_config:
